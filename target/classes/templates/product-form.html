<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product · SmartStock</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-icon">▦</span> SmartStock</div><nav><a href="/">▦ &nbsp; Dashboard</a><a class="active" href="/products">▣ &nbsp; Products</a><a href="/inventory">▤ &nbsp; Inventory</a><a href="/orders">▧ &nbsp; Orders</a><a href="/products">▤ &nbsp; Inventory</a><a href="/orders">▧ &nbsp; Orders</a><a sec:authorize="hasAnyRole('ADMIN','MANAGER')" href="/suppliers">♧ &nbsp; Suppliers</a><a href="/reports">▥ &nbsp; Reports</a><a sec:authorize="hasRole('ADMIN')" href="/settings">⚙ &nbsp; Settings</a></nav><form th:action="@{/logout}" method="post" class="logout"><button type="submit">↪ Sign out</button></form></aside><main class="main"><header class="topbar"><div><div class="eyebrow">CATALOGUE</div><h1 th:text="${product.id == null ? 'Add product' : 'Edit product'}">Add product</h1><p class="muted">Enter product details below.</p></div><a class="btn btn-light" href="/products">← Back</a></header><section class="panel form-panel"><form th:action="@{/products/save}" th:object="${product}" method="post"><input type="hidden" th:field="*{id}"><div class="form-grid"><label>SKU<input th:field="*{sku}" placeholder="SKU-1001" required><small class="field-error" th:errors="*{sku}"></small></label><label>Product name<input th:field="*{name}" placeholder="Product name" required><small class="field-error" th:errors="*{name}"></small></label><label>Category<input th:field="*{category}" placeholder="Electronics" required></label><label>Supplier<input th:field="*{supplier}" placeholder="Supplier name" required></label><label>Unit price<input type="number" min="0" step="0.01" th:field="*{price}" required><small class="field-error" th:errors="*{price}"></small></label><label>Initial stock<input type="number" min="0" th:field="*{stock}" th:readonly="${product.id != null}" required><small class="muted" th:if="${product.id != null}">Use Inventory → Adjust stock so each change is recorded.</small><small class="field-error" th:errors="*{stock}"></small></label><label>Reorder point<input type="number" min="0" th:field="*{reorderPoint}" required></label><label class="checkbox-label"><input type="checkbox" th:field="*{active}"> Active product</label></div><div class="form-actions"><a class="btn btn-light" href="/products">Cancel</a><button class="btn" type="submit">Save product</button></div></form></section></main></div></body></html>
