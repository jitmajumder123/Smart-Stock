<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Supplier · SmartStock</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-icon">▦</span> SmartStock</div><nav><a href="/">▦ &nbsp; Dashboard</a><a href="/products">▣ &nbsp; Products</a><a href="/inventory">▤ &nbsp; Inventory</a><a href="/orders">▧ &nbsp; Orders</a><a class="active" href="/suppliers">♧ &nbsp; Suppliers</a><a href="/reports">▥ &nbsp; Reports</a><a sec:authorize="hasRole('ADMIN')" href="/settings">⚙ &nbsp; Settings</a></nav><form th:action="@{/logout}" method="post" class="logout"><button type="submit">↪ Sign out</button></form></aside><main class="main"><header class="topbar"><div><div class="eyebrow">DIRECTORY</div><h1 th:text="${supplier.id == null ? 'Add supplier' : 'Edit supplier'}">Add supplier</h1><p class="muted">Keep supplier contact details up to date.</p></div><a class="btn btn-light" href="/suppliers">← Back</a></header><section class="panel form-panel"><form th:action="@{/suppliers/save}" th:object="${supplier}" method="post"><input type="hidden" th:field="*{id}"><div class="form-grid"><label>Company name<input th:field="*{name}" required><small class="field-error" th:errors="*{name}"></small></label><label>Contact name<input th:field="*{contactName}" required><small class="field-error" th:errors="*{contactName}"></small></label><label>Email<input type="email" th:field="*{email}"><small class="field-error" th:errors="*{email}"></small></label><label>Phone<input th:field="*{phone}"></label><label class="full">Address<input th:field="*{address}"></label></div><div class="form-actions"><a class="btn btn-light" href="/suppliers">Cancel</a><button class="btn" type="submit">Save supplier</button></div></form></section></main></div></body></html>
